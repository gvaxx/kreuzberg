name: Build security hotfix wheel
'on':
  push:
    branches:
    - fix/security-deps-4.9.6
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the wheel to PyPI as kreuzberg-gvaxx
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  PDFIUM_VERSION: '7678'
  PDFIUM_STATIC_VERSION: '7678'
  ORT_VERSION: 1.24.2
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  CARGO_BUILD_JOBS: '2'
jobs:
  python-wheels:
    name: Build Python wheels (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: linux-x86_64
          os: ubuntu-latest
          artifact: python-wheels-linux-x86_64
          rust_target: x86_64-unknown-linux-gnu
          manylinux: manylinux_2_28
          python: '3.10'
          needs_qemu: false
          extra_args: ''
    steps:
    - name: Maximize build disk space
      if: matrix.os == 'ubuntu-latest'
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 2048
        temp-reserve-mb: 512
        swap-size-mb: 4096
        overprovision-lvm: 'true'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: recursive
    - name: Free up disk space for wheel build
      if: matrix.os == 'ubuntu-latest'
      run: scripts/publish/ubuntu/free-disk-space.sh
    - name: Prepare wheel staging directory
      shell: bash
      run: mkdir -p target/wheels
    - name: Setup Tesseract cache
      id: tesseract-cache
      uses: ./.github/actions/setup-tesseract-cache
      with:
        label: ${{ matrix.label }}
        enable-cache: 'true'
        rust-target: ${{ matrix.rust_target }}
    - name: Clean previous wheel artifacts
      shell: bash
      run: rm -rf target/wheels target/maturin && find packages/python/kreuzberg -name "_internal_bindings.*" ! -name "*.pyi"
        -delete
    - name: Build Linux wheels
      if: runner.os == 'Linux'
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --locked -i python${{ matrix.python }} --out ../../target/wheels ${{ matrix.extra_args }}
        target: ${{ matrix.rust_target }}
        manylinux: ${{ matrix.manylinux }}
        working-directory: packages/python
        sccache: false
        docker-options: ${{ steps.tesseract-cache.outputs.docker-options }}
        before-script-linux: |
          set -euo pipefail
          # Prevent GCC 14+ from emitting C23-versioned glibc symbols
          # (__isoc23_strtoll etc.) that require glibc ≥ 2.38.
          # This affects manylinux_2_28 on systems like Debian 12 (glibc 2.36), Ubuntu 22.04.
          # We force the compiler to use the C11/C++17 standard at every FFI boundary
          # by setting flags at the compiler, build system, and environment level.
          #
          # Strategy:
          # 1. Set base CFLAGS/CXXFLAGS for direct compilation
          # 2. Propagate to CMake (respects CMAKE_C_FLAGS, CMAKE_CXX_FLAGS)
          # 3. Set CPPFLAGS for autotools-based deps (e.g. libssl)
          export CFLAGS="-std=gnu11"
          export CXXFLAGS="-std=gnu++17"
          # Propagate C23 suppressions to CMake-based build systems (Tesseract/Leptonica/ORT).
          export CMAKE_C_FLAGS="${CFLAGS}"
          export CMAKE_CXX_FLAGS="${CXXFLAGS}"
          rustup component add rust-src || true
          # Install dependencies based on the container distro
          if command -v yum >/dev/null 2>&1; then
            # CentOS/RHEL (manylinux containers)
            yum install -y openssl openssl-devel pkgconfig
            export OPENSSL_LIB_DIR=/usr/lib64
            export OPENSSL_INCLUDE_DIR=/usr/include
          elif command -v apt-get >/dev/null 2>&1; then
            # Debian/Ubuntu
            apt-get update && apt-get install -y pkg-config libssl-dev
            ARCH=$(uname -m)
            if [ "$ARCH" = "aarch64" ]; then
              export OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu
            else
              export OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
            fi
            export OPENSSL_INCLUDE_DIR=/usr/include
          fi
          # Use the official manylinux x86_64 wheel for the version of ORT required
          # by ort-sys. Only the shared library is used. The Python ABI is irrelevant.
          ORT_VERSION="${{ env.ORT_VERSION }}"
          ORT_WHEEL_URL="https://files.pythonhosted.org/packages/2c/32/4e5921ba8b82ac37cad45f1108ca6effd430f49c7f20577d53f317d166ed/onnxruntime-${ORT_VERSION}-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          ORT_WHEEL_SHA256="93fe190ee555ae8e9c1214bcfcf13af85cd06dd835e8d835ce5a8d01056844fe"
          ORT_DIR=$(mktemp -d)
          curl --retry 3 -fsSL "$ORT_WHEEL_URL" -o "$ORT_DIR/onnxruntime.whl"
          echo "$ORT_WHEEL_SHA256  $ORT_DIR/onnxruntime.whl" | sha256sum -c -
          ORT_LIB="libonnxruntime.so.${ORT_VERSION}"
          /opt/python/cp310-cp310/bin/python -c 'import sys, zipfile; sys.stdout.buffer.write(zipfile.ZipFile(sys.argv[1]).read("onnxruntime/capi/" + sys.argv[2]))' "$ORT_DIR/onnxruntime.whl" "$ORT_LIB" > "/usr/lib/$ORT_LIB"
          ln -sf "$ORT_LIB" /usr/lib/libonnxruntime.so.1
          ln -sf "$ORT_LIB" /usr/lib/libonnxruntime.so
          export ORT_LIB_LOCATION=/usr/lib
          export ORT_PREFER_DYNAMIC_LINK=1
    - name: List built wheels
      shell: bash
      run: ls -lh target/wheels
    - name: Verify no C23 glibc symbols in Linux wheels
      if: runner.os == 'Linux'
      shell: bash
      run: "set -euo pipefail\necho \"=== Checking for C23 glibc symbols in wheel binaries ===\"\nfailed=0\n\nfor wheel in\
        \ target/wheels/*.whl; do\n  echo \"Extracting and checking: $(basename \"$wheel\")\"\n  wheel_dir=$(mktemp -d)\n\
        \  trap 'rm -rf \"$wheel_dir\" 2>/dev/null || true' EXIT\n  unzip -q \"$wheel\" -d \"$wheel_dir\"\n\n  # Use process\
        \ substitution to avoid subshell variable scoping issue\n  while IFS= read -r so_file; do\n    [[ -z \"$so_file\"\
        \ ]] && continue\n    echo \"  Scanning: $(basename \"$so_file\")\"\n    if nm -D \"$so_file\" 2>/dev/null | grep\
        \ -qE '__isoc23_'; then\n      echo \"    ERROR: Found C23 glibc symbol(s) in $so_file:\"\n      nm -D \"$so_file\"\
        \ 2>/dev/null | grep '__isoc23_' || true\n      failed=1\n    else\n      echo \"    OK: No C23 glibc symbols found\"\
        \n    fi\n  done < <(find \"$wheel_dir\" -type f \\( -name \"*.abi3.so\" -o -name \"*.so\" \\) 2>/dev/null || true)\n\
        \n  rm -rf \"$wheel_dir\" 2>/dev/null || true\n  trap - EXIT\ndone\n\nif [ \"$failed\" -eq 1 ]; then\n  echo \"\"\n\
        \  echo \"FAILED: Wheel contains C23 glibc symbols incompatible with glibc < 2.38\"\n  echo \"This breaks compatibility\
        \ with Debian 12, Ubuntu 22.04, and other systems with glibc 2.36.\"\n  exit 1\nfi\necho \"\"\necho \"SUCCESS: All\
        \ wheels are free of C23 glibc symbols\"\n"
    - name: Setup Python for smoke test
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Smoke test wheel
      shell: bash
      run: 'python -m pip install --force-reinstall target/wheels/*.whl

        python scripts/ci/python/test-docx-table-padding.py

        python scripts/ci/python/test-hwp-extraction.py test_documents/hwp

        python scripts/ci/python/check-sbom-versions.py target/wheels/*.whl'
    - name: Clean up Docker resources (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && always()
      run: scripts/publish/ubuntu/docker-prune.sh
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: kreuzberg-4.9.7-security-linux-x86_64
        path: target/wheels/*.whl
        if-no-files-found: error
        retention-days: 30
  publish-pypi:
    name: Publish to PyPI
    needs: python-wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kreuzberg-gvaxx/
    permissions:
      id-token: write
    steps:
    - name: Download wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: kreuzberg-4.9.7-security-linux-x86_64
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        packages-dir: dist
